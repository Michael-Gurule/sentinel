# Missile launch near a fire-control radar, an aircraft with a datalink, and a
# wildfire, observed by a GEO OPIR sensor and a five-receiver RF network.
# Magnitudes are illustrative, not representative of any real system.
name: launch_with_radar
origin: {lat_deg: 40.0, lon_deg: -100.0, alt_m: 500.0}
duration_s: 120.0

sensor:
  platform: {kind: geo, longitude_deg: -100.0}
  frame_rate_hz: 10.0
  nei: 1.0

scene:
  background: 200.0
  clutter_std: 1.0
  mean_clear_s: 90.0
  mean_cloudy_s: 30.0
  cloud_top_m: 6000.0
  glint_rate_hz: 0.02

events:
  - {kind: launch, id: launch-1, onset_s: 20.0, position_m: [5000.0, 5000.0, 0.0],
     azimuth_deg: 60.0, burn_time: 90.0, peak_intensity: 3.0e+5, staging_time: 55.0}
  - {kind: aircraft, id: aircraft-1, onset_s: -60.0, position_m: [-20000.0, 0.0, 9000.0],
     velocity_mps: [220.0, 40.0, 0.0], base_intensity: 8.0e+3}
  - {kind: fire, id: fire-1, onset_s: 0.0, position_m: [-8000.0, 12000.0, 0.0],
     peak_intensity: 1.0e+5, growth_time: 60.0}

rf:
  receivers:
    - {id: 0, position_m: [0.0, 0.0, 500.0], clock_bias_std_ns: 5.0, position_error_std_m: 2.0}
    - {id: 1, position_m: [10000.0, 0.0, 1500.0], clock_bias_std_ns: 5.0, position_error_std_m: 2.0}
    - {id: 2, position_m: [10000.0, 10000.0, 1000.0], clock_bias_std_ns: 5.0, position_error_std_m: 2.0}
    - {id: 3, position_m: [0.0, 10000.0, 2000.0], velocity_mps: [0.0, 150.0, 0.0], clock_bias_std_ns: 5.0}
    - {id: 4, position_m: [5000.0, -4000.0, 6000.0], velocity_mps: [120.0, 0.0, 0.0], clock_bias_std_ns: 5.0}
  emitters:
    - {id: radar-1, attached_to: launch-1, profile: fire_control_radar, scan_period_s: 2.0,
       active_intervals_s: [[0.0, 25.0]]}
    - {id: datalink-1, attached_to: aircraft-1, profile: datalink, scan_period_s: 1.0,
       measure_fdoa: true}
