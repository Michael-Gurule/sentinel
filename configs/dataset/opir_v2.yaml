# SENTINEL OPIR event-classification dataset, version 2.
#
# 64 s windows at 10 Hz from a GEO staring sensor; five classes (launch,
# explosion, fire, aircraft, background). Base priors are defined in
# sentinel.data.config; splits may override them. The three shift_* splits are
# held-out test sets drawn from deliberately shifted distributions.
#
# All magnitudes are illustrative and unclassified (see docs/data_card.md).
name: opir_v2
version: "2.0.0"
root_seed: 20261008
window_s: 64.0

splits:
  - name: train
    samples_per_class: 3000
    description: In-distribution training data.
  - name: validation
    samples_per_class: 600
    description: In-distribution validation data (model selection, calibration).
  - name: test
    samples_per_class: 600
    description: In-distribution test data.

  - name: shift_low_snr
    samples_per_class: 600
    description: Degraded sensor; noise-equivalent irradiance 4x the training range.
    overrides:
      sensor: {nei: {low: 2.0, high: 8.0, log: true}}

  - name: shift_params
    samples_per_class: 600
    description: >-
      Event physics outside the training ranges: short burns that end inside the
      window, fast launch rises, long fireballs, fast-growing fires, frequent
      afterburner use.
    overrides:
      launch: {burn_time: {low: 25.0, high: 55.0}, rise_time: {low: 0.3, high: 1.0},
               onset_s: {low: 2.0, high: 20.0}}
      explosion: {fireball_decay: {low: 6.0, high: 15.0}}
      fire: {growth_time: {low: 5.0, high: 20.0}}
      aircraft: {afterburner_probability: 0.8}

  - name: shift_clutter
    samples_per_class: 600
    description: Harsh scenes; heavy clutter, frequent sun glint, and frequent cloud.
    overrides:
      scene:
        clutter_std: {low: 3.0, high: 10.0, log: true}
        glint_probability: 0.9
        glint_rate_hz: {low: 0.05, high: 0.2}
        cloud_probability: 0.9
